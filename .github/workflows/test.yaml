---
name: test
on:
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # To checkout this pull request
    timeout-minutes: 10
    env:
      AQUA_CONFIG: ${{github.workspace}}/.github/actions/auto_approve/aqua/aqua.yaml
    defaults:
      run:
        working-directory: .github/actions/auto_approve
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Install bun
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
