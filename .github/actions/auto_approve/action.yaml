name: auto-approve
description: |
  Check whether a pull request can be approved automatically.
  This action implements the approval rule of this repository and never approves the pull request itself,
  so it doesn't need any access token other than GITHUB_TOKEN.
outputs:
  ok:
    description: |
      "true" if the pull request updates only files under staging/, otherwise "false".
    value: ${{steps.check.outputs.ok}}
runs:
  using: composite
  steps:
    - name: Install bun
      uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
      with:
        aqua_version: v2.62.2
      env:
        AQUA_CONFIG: ${{github.action_path}}/aqua/aqua.yaml
    - run: bun run index.ts
      id: check
      shell: bash
      working-directory: ${{github.action_path}}
      env:
        AQUA_CONFIG: ${{github.action_path}}/aqua/aqua.yaml
        # pull-requests:read is required to list the updated files
        GITHUB_TOKEN: ${{github.token}}
        PULL_REQUEST_NUMBER: ${{github.event.pull_request.number}}
        PATH_PREFIXES: staging/
